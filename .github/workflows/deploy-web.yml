name: Deploy week viewer to GitHub Pages

# Publishes the backend-free week viewer: reads the coach's Google Sheet,
# writes workouts.json, and deploys it next to the Flutter web build.
# Runs on every push to master, every morning, or manually.
on:
  push:
    branches: [master]
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC daily — picks up whatever the coach added
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Build and deploy are separate jobs, as in GitHub's Pages starter workflow.
# In one job, deploy-pages ran a fraction of a second after the upload and
# sometimes found no artifact yet ("No artifacts named github-pages"), which
# failed every attempt on 2026-11-24. A re-run of a run whose upload already
# succeeded also fails: it finds two artifacts. Start a fresh run instead.
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read training sheet
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          pip install --quiet google-auth requests
          python3 tools/sheet_to_json.py workouts.json

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      # APPS_SCRIPT_URL is the web app URL of apps_script/Code.gs (repo
      # variable). When unset, notes and coach edits are hidden.
      - name: Build Flutter Web
        working-directory: mobile
        env:
          APPS_SCRIPT_URL: ${{ vars.APPS_SCRIPT_URL }}
        run: |
          flutter build web --release \
            -t lib/main.dart \
            --pwa-strategy=none \
            --base-href=/crossfit-app/ \
            --dart-define=APPS_SCRIPT_URL="$APPS_SCRIPT_URL"
          cp ../workouts.json build/web/workouts.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
