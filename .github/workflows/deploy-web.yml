name: Deploy week viewer to GitHub Pages

# Publishes the backend-free week viewer: reads the coach's Google Sheet,
# writes workouts.json, and deploys it next to the Flutter web build.
# Runs on every push to master, every morning, or manually.
on:
  push:
    branches: [master]
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC daily — picks up whatever the coach added
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read training sheet
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          pip install --quiet google-auth requests
          python3 tools/sheet_to_json.py workouts.json

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Flutter Web
        working-directory: mobile
        run: |
          flutter build web --release \
            -t lib/main.dart \
            --pwa-strategy=none \
            --base-href=/crossfit-app/
          cp ../workouts.json build/web/workouts.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/build/web

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
