services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PGDATABASE:-crossfit_db}
      POSTGRES_USER: ${PGUSER:-crossfit_user}
      POSTGRES_PASSWORD: ${PGPASSWORD:-crossfit_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-crossfit_user} -d ${PGDATABASE:-crossfit_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
