spring.application.name=crossfit-app

# Server port (Railway injects PORT automatically)
server.port=${PORT:8080}

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/crossfit_db
spring.datasource.username=${DB_USERNAME:crossfit_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000
jwt.refresh-expiration-days=7

# Password reset
app.password-reset.expiration-minutes=30
app.frontend-url=${FRONTEND_URL:https://ajenux.github.io/crossfit-app}

# Email verification
app.email-verification.expiration-hours=24

# Mail (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# ExerciseDB (RapidAPI)
exercisedb.api.key=${EXERCISEDB_API_KEY:}

# AI
anthropic.api.key=${ANTHROPIC_API_KEY:}
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:9090}

# Google Sheets
google.sheets.spreadsheet-id=${GOOGLE_SHEETS_SPREADSHEET_ID:1LUksfUebyzp2ZeplLAFEmOlvwbgBOOlw25JU7ivbUgk}
google.credentials.json=${GOOGLE_CREDENTIALS_JSON:}
